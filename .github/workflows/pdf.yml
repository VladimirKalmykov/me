name: Generate role-specific resume PDFs

on:
  push:
    paths:
      - scripts/build-portfolio-pdfs.py
      - scripts/verify-portfolio-pdfs.py
      - assets/avatar-print.jpg
      - assets/fonts/Geologica-Regular.ttf
      - assets/fonts/Geologica-Semibold.ttf
      - .github/workflows/pdf.yml
  workflow_dispatch:

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pdf:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build editorial PDFs
        run: |
          python -m pip install 'reportlab>=4,<5' 'pypdf>=5,<7'
          python scripts/build-portfolio-pdfs.py
          python scripts/verify-portfolio-pdfs.py
          cp output/pdf/frontend-ru.pdf resume-ru.pdf
          cp output/pdf/frontend-en.pdf resume-en.pdf
          mkdir -p pdf
          cp output/pdf/frontend-ru.pdf pdf/frontend-ru.pdf
          cp output/pdf/frontend-en.pdf pdf/frontend-en.pdf
          cp output/pdf/fullstack-ru.pdf pdf/fullstack-ru.pdf
          cp output/pdf/fullstack-en.pdf pdf/fullstack-en.pdf

      - name: Commit PDFs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/*.pdf pdf/*.pdf resume-ru.pdf resume-en.pdf
          if git diff --staged --quiet; then
            echo "PDFs unchanged"
            exit 0
          fi
          git commit -m "Update role-specific resume PDFs"
          git push
